name: CI & Security Gate Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Test & Security Gate Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Unit & Integration Tests (100% Pass)
        run: npm test

      - name: Verify Security Gate Regression Suite (48 Checks)
        run: npx vitest run tests/unit/security-regression.test.ts

      - name: Verify Code Coverage (>80% Threshold)
        run: npm run test:coverage

      - name: Run Flagship AI Security Audit Demo (sample-project)
        run: npm run demo
        env:
          DEMO_MODE: 'true'
          KEI_DEFAULT_MODEL: 'glm-5.3-flash'
